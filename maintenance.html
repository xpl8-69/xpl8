<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0d0d;
      --tx: #e0e0e0;
      --mu: #555;
      --gr: #6ee7a0;
      --re: #f87171;
    }

    body {
      background: var(--bg);
      color: var(--tx);
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: none;
    }

    /* subtle radial bg like the CTF */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 15% 35%, rgba(110,231,160,.025) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 85% 70%, rgba(96,165,250,.02) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
      animation: bgPulse 9s ease-in-out infinite alternate;
    }

    @keyframes bgPulse {
      from { opacity: .7; }
      to   { opacity: 1; }
    }

    /* glow that follows the cursor */
    #glow {
      position: fixed;
      width: 460px;
      height: 460px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(110,231,160,.04) 0%, transparent 68%);
      pointer-events: none;
      z-index: 0;
      transform: translate(-50%, -50%);
      transition: left .07s linear, top .07s linear;
    }

    /* custom cursor */
    #cur {
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
    }
    .cur-ring {
      width: 22px; height: 22px;
      border: 1px solid rgba(110,231,160,.5);
      border-radius: 50%;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      transition: all .15s;
    }
    .cur-dot {
      position: absolute;
      top: 50%; left: 50%;
      width: 3px; height: 3px;
      background: rgba(110,231,160,.8);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    /* main card */
    .wrap {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 48px 32px;
      max-width: 560px;
      width: 100%;
    }

    .tag {
      font-size: 10px;
      color: var(--gr);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 36px;
      opacity: .8;
    }

    .main-text {
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 600;
      color: var(--tx);
      letter-spacing: -1px;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    /* blinking cursor after the text */
    .main-text::after {
      content: '_';
      color: var(--gr);
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    .sub {
      font-size: 11px;
      color: var(--mu);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 32px;
    }

    /* scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,.08) 3px,
        rgba(0,0,0,.08) 4px
      );
      pointer-events: none;
      z-index: 2;
    }
  </style>
</head>
<body>

<div id="glow"></div>
<div id="cur"><div class="cur-ring"></div><div class="cur-dot"></div></div>

<div class="wrap">
  <div class="tag">0x69er CTF</div>
  <div class="main-text">working on maintenance!</div>
  <div class="sub">back soon &nbsp;·&nbsp; hang tight</div>
</div>

<script>
  // glow + cursor follow
  document.addEventListener('mousemove', e => {
    const g = document.getElementById('glow');
    const c = document.getElementById('cur');
    if (g) { g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px'; }
    if (c) { c.style.left = e.clientX + 'px'; c.style.top = e.clientY + 'px'; }
  });
</script>

</body>
</html>
